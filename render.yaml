services:
  - type: web
    name: reviai
    env: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: FREE_GENERATIONS_PER_DAY
        value: "3"
      - key: FREE_DETECTIONS_PER_DAY
        value: "6"
      - key: FREE_EXERCISES_PER_DAY
        value: "3"
      - key: FREE_CHAT_MESSAGES_PER_DAY
        value: "10"
      - key: FREE_QUIZZES_PER_DAY
        value: "3"
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APPS_SCRIPT_MAIL_URL
        sync: false
      - key: APPS_SCRIPT_MAIL_TOKEN
        sync: false
      - key: FEEDBACK_DATABASE_REQUIRED
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ADS_ENABLED
        value: "false"
      - key: ADS_CONSENT_READY
        value: "false"
      - key: ADSENSE_CLIENT_ID
        sync: false
      - key: ADSENSE_SLOT_ID
        sync: false
      - key: ADSENSE_PUBLISHER_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
